name: Compose Config Check

on:
  pull_request:
    branches: [main]
    paths:
      - docker-compose.yml
      - docker-compose.images.yml
      - docker-compose.local.yml
      - docker-compose.dev.yml
      - .github/workflows/compose-config-check.yml
  push:
    branches: [main]
    paths:
      - docker-compose.yml
      - docker-compose.images.yml
      - docker-compose.local.yml
      - docker-compose.dev.yml
      - .github/workflows/compose-config-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-config-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-config:
    name: Compose Config Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate local compose config
        run: docker compose -f docker-compose.local.yml config --quiet

      - name: Validate local audio analysis profile
        run: docker compose -f docker-compose.local.yml --profile audio-analysis config --quiet

      - name: Validate local DCLAP provider profile
        run: docker compose -f docker-compose.local.yml --profile vibe-provider-dclap config --quiet

      - name: Validate dev compose config
        run: docker compose -f docker-compose.dev.yml config --quiet

      - name: Validate dev audio analysis profile
        run: docker compose -f docker-compose.dev.yml --profile audio-analysis config --quiet

      - name: Validate dev DCLAP provider profile
        run: docker compose -f docker-compose.dev.yml --profile vibe-provider-dclap config --quiet

      - name: Validate prebuilt split-stack image overlay
        env:
          POSTGRES_PASSWORD: compose-check-postgres-password
          SESSION_SECRET: compose-check-session-secret
          SETTINGS_ENCRYPTION_KEY: compose-check-settings-key
          INTERNAL_API_SECRET: compose-check-internal-api-secret
          SOUNDSPAN_IMAGE_TAG: main-deadbee
        run: docker compose -f docker-compose.yml -f docker-compose.images.yml --profile worker config --quiet
