name: Music Route Monitor

on:
  pull_request:
    paths:
      - "scripts/music_route_monitor.py"
      - "scripts/music-route-runtime.cjs"
      - "scripts/tests/test_music_route_monitor.py"
      - "scripts/tests/music-route-runtime.test.cjs"
      - ".github/workflows/music-route-monitor.yml"
  push:
    branches: [main, develop]
    paths:
      - "scripts/music_route_monitor.py"
      - "scripts/music-route-runtime.cjs"
      - "scripts/tests/test_music_route_monitor.py"
      - "scripts/tests/music-route-runtime.test.cjs"
      - ".github/workflows/music-route-monitor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: music-route-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Test public HTTP and durable incident lifecycle
        run: python3 -m unittest discover -s scripts/tests -p test_music_route_monitor.py
      - name: Test auth scope and administrator notification retries
        run: node --test scripts/tests/music-route-runtime.test.cjs
