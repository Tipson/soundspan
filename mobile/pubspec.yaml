name: soundspan
description: "Музыкальное приложение Soundspan"
publish_to: 'none'
version: 0.1.21+24

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audio_service: 0.18.19
  audio_session: 0.2.4
  crypto: 3.0.7
  flutter_secure_storage: 11.2.0
  file_selector: 1.1.0
  just_audio: 0.10.6
  path_provider: 2.1.6
  sqflite: 2.4.4+2
  soundspan_session_bridge:
    path: packages/soundspan_session_bridge

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand-mark.png
    - assets/wave-dusk-city.png
